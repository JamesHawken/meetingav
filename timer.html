<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting AV timer</title>
<!-- The timer screen, like OnlyT: shown full screen where the speakers can see it. MeetingAV.exe
     keeps the time; this only shows it. Green while there's time, amber in the last minute, red and
     counting up once over time. With no part loaded it shows the time of day - and in the last
     5 minutes before the meeting, a countdown to it. -->
<style>
  @font-face { font-family: "Inter"; src: url("lib/InterVariable.woff2") format("woff2");
               font-weight: 100 900; font-style: normal; font-display: swap; }
  html, body { margin: 0; height: 100%; background: #000; color: #e5e7eb; overflow: hidden; cursor: none;
               font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
               -webkit-font-smoothing: antialiased; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #label { font-size: 8vh; font-weight: 600; color: #e5e7eb; min-height: 10vh; text-align: center; padding: 0 5vw;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90vw; }
  #time { font-size: min(40vw, 64vh); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;
          letter-spacing: -.03em; transition: color .3s ease, opacity .3s ease; }
  #time.clock { font-weight: 500; color: #d1d5db; font-size: min(26vw, 48vh); }
  #time.soon { color: #f5f5f7; }
  #time.ok { color: #30d158; }
  #time.warn { color: #ff9f0a; }
  #time.over { color: #ff453a; }
  #time.paused { opacity: .45; }
  /* Grows by sliding (scaleX), not by changing its width: no relayout every tick. */
  #bar { position: fixed; left: 0; bottom: 0; height: 1.4vh; width: 100%; background: #30d158;
         transform: scaleX(0); transform-origin: left; transition: transform .2s linear, background-color .3s ease; }
  #bar.warn { background: #ff9f0a; }
  #bar.over { background: #ff453a; }
</style>
</head>
<body>
<div id="wrap"><div id="label"></div><div id="time"></div></div>
<div id="bar"></div>
<script>
const $ = id => document.getElementById(id);
let timer = null, offset = 0;   // the app's clock minus this one
// ?countdown: the countdown laid over JW Library's screen before the meeting - nothing else.
const countdownOnly = location.search.includes('countdown');

// m:ss - rounded up while counting down (so it reaches 0:00 at zero), down once over time.
function fmt(ms) {
  const s = ms >= 0 ? Math.ceil(ms / 1000) : Math.floor(-ms / 1000);
  return (ms < 0 ? '+' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function render() {
  const time = $('time'), bar = $('bar');
  // The last 5 minutes before the meeting: a countdown to it.
  const toGo = timer && (countdownOnly || !timer.length) && timer.meetingAt ? timer.meetingAt - (Date.now() + offset) : 0;
  if (toGo > 0 && toGo <= 5 * 60000) {
    time.className = 'soon';
    time.textContent = fmt(toGo);
    time.style.fontSize = '';
    $('label').textContent = 'Meeting starts in';
    bar.className = '';
    bar.style.transform = `scaleX(${1 - toGo / (5 * 60000)})`;
    return;
  }
  if (countdownOnly) {   // before the countdown or once it's over (the window closes then anyway)
    time.textContent = $('label').textContent = '';
    bar.style.transform = 'scaleX(0)';
    return;
  }
  if (!timer || !timer.length) {
    time.className = 'clock';
    time.style.fontSize = '';
    time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('label').textContent = '';
    bar.style.transform = 'scaleX(0)';
    return;
  }
  const left = timer.running ? timer.endsAt - (Date.now() + offset) : timer.left;
  const state = left < 0 ? 'over' : left <= 60000 ? 'warn' : 'ok';
  time.className = state + (timer.running ? '' : ' paused');
  time.textContent = fmt(left);
  time.style.fontSize = `min(${Math.round(160 / time.textContent.length)}vw, 64vh)`;   // "+12:30" still fits
  $('label').textContent = timer.label || '';
  bar.className = state;
  bar.style.transform = `scaleX(${Math.min(1, Math.max(0, 1 - left / timer.length))})`;
}

async function poll() {
  try {
    const r = await fetch('/timer', { headers: { 'X-Meeting-Camera': '1' } });
    if (r.ok) { timer = await r.json(); offset = timer.now - Date.now(); }
  } catch {}
}

// Ticks from a worker: this window never has the focus and is often covered, and the browser slows
// a page's own timers then, so the countdown would jump instead of ticking every second.
function every(ms, fn) {
  try {
    const w = new Worker(URL.createObjectURL(new Blob([`setInterval(() => postMessage(0), ${ms})`], { type: 'text/javascript' })));
    w.onmessage = fn;
    w.onerror = () => { w.terminate(); setInterval(fn, ms); };
  } catch { setInterval(fn, ms); }
}
poll();
every(400, poll);
every(100, render);
render();
</script>
</body>
</html>
