<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting AV timer</title>
<!-- The timer screen, like OnlyT: shown full screen where the speakers can see it. MeetingAV.exe
     keeps the time; this only shows it. Green while there's time, amber in the last minute, red and
     counting up once over time. With no part loaded it shows the time of day. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e5e7eb; overflow: hidden; cursor: none;
               font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #label { font-size: 5vh; color: #9ca3af; min-height: 7vh; text-align: center; padding: 0 5vw;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90vw; }
  #time { font-size: min(40vw, 64vh); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;
          letter-spacing: -.02em; transition: color .3s; }
  #time.clock { font-weight: 500; color: #d1d5db; font-size: min(26vw, 48vh); }
  #time.ok { color: #22c55e; }
  #time.warn { color: #f59e0b; }
  #time.over { color: #ef4444; }
  #time.paused { opacity: .45; }
  #bar { position: fixed; left: 0; bottom: 0; height: 1.4vh; width: 0; background: #22c55e; transition: width .2s linear; }
  #bar.warn { background: #f59e0b; }
  #bar.over { background: #ef4444; }
</style>
</head>
<body>
<div id="wrap"><div id="label"></div><div id="time"></div></div>
<div id="bar"></div>
<script>
const $ = id => document.getElementById(id);
let timer = null, offset = 0;   // the app's clock minus this one

// m:ss - rounded up while counting down (so it reaches 0:00 at zero), down once over time.
function fmt(ms) {
  const s = ms >= 0 ? Math.ceil(ms / 1000) : Math.floor(-ms / 1000);
  return (ms < 0 ? '+' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function render() {
  const time = $('time'), bar = $('bar');
  if (!timer || !timer.length) {
    time.className = 'clock';
    time.style.fontSize = '';
    time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('label').textContent = '';
    bar.style.width = '0';
    return;
  }
  const left = timer.running ? timer.endsAt - (Date.now() + offset) : timer.left;
  const state = left < 0 ? 'over' : left <= 60000 ? 'warn' : 'ok';
  time.className = state + (timer.running ? '' : ' paused');
  time.textContent = fmt(left);
  time.style.fontSize = `min(${Math.round(160 / time.textContent.length)}vw, 64vh)`;   // "+12:30" still fits
  $('label').textContent = timer.label || '';
  bar.className = state;
  bar.style.width = Math.min(100, Math.max(0, (1 - left / timer.length) * 100)) + '%';
}

async function poll() {
  try {
    const r = await fetch('/timer', { headers: { 'X-Meeting-Camera': '1' } });
    if (r.ok) { timer = await r.json(); offset = timer.now - Date.now(); }
  } catch {}
}

poll();
setInterval(poll, 400);
setInterval(render, 100);
render();
</script>
</body>
</html>
